name: Build APK

# Builds the FOSS release variant of this fork on every push to main (and on demand).
# The APK is signed with the repository's own keystore when the KEYSTORE secrets are
# configured; otherwise the unsigned APK is uploaded so the build can still be inspected.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FOSS release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: Metrolist
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        if: env.HAS_KEYSTORE == 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Collect APK
        run: |
          set -e
          DIR="app/build/outputs/apk/foss/release"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          mkdir -p "$DIR/out"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            SRC="$(find "$DIR" -maxdepth 1 -name '*-signed.apk' | head -n1)"
            NAME="Metrolist-StatusBarLyrics-$SHORT_SHA.apk"
          else
            SRC="$(find "$DIR" -maxdepth 1 -name '*.apk' | head -n1)"
            NAME="Metrolist-StatusBarLyrics-$SHORT_SHA-unsigned.apk"
          fi
          test -n "$SRC"
          cp "$SRC" "$DIR/out/$NAME"
          ls -la "$DIR/out"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-StatusBarLyrics
          path: app/build/outputs/apk/foss/release/out/*.apk
